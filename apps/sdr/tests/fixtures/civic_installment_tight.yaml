name: "Civic installment tightness (semantic equivalent of Corolla roteiro)"
description: >
  Same financing contracts with a different sedan and a monthly installment
  that is tight vs published cash price. Decision must offer alternatives
  indirectly (never months). Rejecting continues the roteiro.

turns:
  - role: customer
    text: "Vocês têm esse sedan Civic? Queria mais informações"
    understanding:
      intent: purchase
      language: pt-BR
      budget_status: null
      pending_resolution: null
      alternative_scope: null
      facts_entries:
        - key: desired_model
          value: Civic
      signals:
        explicit_handoff: null
        explicit_offer: null
        visit_intent: null
        high_purchase_intent: null
        sensitive_data_refusal: null
      confidence_entries:
        - key: intent
          value: 0.92

  - role: customer
    text: "Compra"
    understanding:
      intent: purchase
      language: pt-BR
      budget_status: null
      pending_resolution: null
      alternative_scope: null
      facts_entries:
        - key: deal_type
          value: purchase
      signals:
        explicit_handoff: null
        explicit_offer: null
        visit_intent: null
        high_purchase_intent: null
        sensitive_data_refusal: null
      confidence_entries:
        - key: intent
          value: 0.95

  - role: customer
    text: "Quero parcelar"
    understanding:
      intent: purchase_financing
      language: pt-BR
      budget_status: null
      pending_resolution: null
      alternative_scope: null
      facts_entries:
        - key: payment_method
          value: financing
      signals:
        explicit_handoff: null
        explicit_offer: null
        visit_intent: null
        high_purchase_intent: null
        sensitive_data_refusal: null
      confidence_entries:
        - key: intent
          value: 0.94

  - role: customer
    text: "Entrada de 5 mil"
    understanding:
      intent: purchase_financing
      language: pt-BR
      budget_status: null
      pending_resolution: null
      alternative_scope: null
      facts_entries:
        - key: down_payment
          value: "5000"
      signals:
        explicit_handoff: null
        explicit_offer: null
        visit_intent: null
        high_purchase_intent: null
        sensitive_data_refusal: null
      confidence_entries:
        - key: intent
          value: 0.9

  - role: customer
    text: "parcela de 1000"
    understanding:
      intent: purchase_financing
      language: pt-BR
      budget_status: null
      pending_resolution: null
      alternative_scope: null
      facts_entries:
        - key: desired_installment
          value: "1000"
      signals:
        explicit_handoff: null
        explicit_offer: null
        visit_intent: null
        high_purchase_intent: null
        sensitive_data_refusal: null
      confidence_entries:
        - key: intent
          value: 0.9

  - role: customer
    text: "Não, seguimos com esse"
    understanding:
      intent: purchase_financing
      language: pt-BR
      budget_status: null
      pending_resolution: REJECT
      alternative_scope: null
      facts_entries: []
      signals:
        explicit_handoff: null
        explicit_offer: null
        visit_intent: null
        high_purchase_intent: null
        sensitive_data_refusal: null
      confidence_entries:
        - key: intent
          value: 0.88

assertions:
  no_reintro_after_first_turn: true
  state_persists_across_turns: true
  tool_executed_inventory: true

turn_assertions:
  - turn: 1
    intent: purchase
    action: show_offers
    greeting_in_response: true
    facts_include:
      desired_model: Civic
    has_outbound_media: true
    caption_title_bold: true
    last_media_url_contains: civic-cover
    follow_up_deal_type: true

  - turn: 2
    ask_field: payment_method
    response_contains:
      - Entendi seu interesse na compra
    no_greeting_in_response: true

  - turn: 3
    ask_field: down_payment

  - turn: 4
    ask_field: desired_installment
    response_must_not:
      - meses
      - prazo mais curto

  - turn: 5
    ask_field: alternatives_ok
    reason_code: installment_tight
    response_contains:
      - parcela
    response_must_not:
      - meses
      - prazo mais curto
      - 60

  - turn: 6
    ask_field: documents
    response_must_not:
      - meses
