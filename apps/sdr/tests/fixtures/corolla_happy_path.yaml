name: "Corolla happy path (first-contact greeting + financing roteiro + dissertative handoff)"
description: >
  Class-level golden for the exported Corolla thread: first commercial turn
  greets and sends photos (cover last, bold title), deal_type recap, installment
  after down payment, document ack then visit, handoff with site URL.
  No brand/model heuristics — contracts are cadence, roteiro and presentation.

