# FacilCar SDR local stack (isolated from docker-compose.evolution.yml)
# Usage:
#   docker compose -f docker-compose.sdr.yml --profile core up -d --build
#   curl -s http://localhost:8000/health
#
# Secrets / DB come from apps/sdr/.env (same file used by local `python -m sdr.worker`).
# Only REDIS_URL is forced to the compose Redis service name.

services:
  facilcar-sdr-redis:
    image: redis:7-alpine
    container_name: facilcar-sdr-redis
    profiles: ["core"]
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - facilcar-sdr
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  facilcar-sdr-api:
    build:
      context: ./apps/sdr
      dockerfile: Dockerfile
    container_name: facilcar-sdr-api
    profiles: ["core"]
    restart: unless-stopped
    depends_on:
      facilcar-sdr-redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - ./apps/sdr/.env
    environment:
      # Override host Redis / Evolution from .env (localhost) for Docker network.
      REDIS_URL: redis://facilcar-sdr-redis:6379/0
      EVOLUTION_API_URL: http://host.docker.internal:8081
    networks:
      - facilcar-sdr
    command: ["uvicorn", "sdr.main:app", "--host", "0.0.0.0", "--port", "8000"]

  facilcar-sdr-worker:
    build:
      context: ./apps/sdr
      dockerfile: Dockerfile
    container_name: facilcar-sdr-worker
    profiles: ["core"]
    restart: unless-stopped
    depends_on:
      facilcar-sdr-redis:
        condition: service_healthy
    env_file:
      - ./apps/sdr/.env
    environment:
      REDIS_URL: redis://facilcar-sdr-redis:6379/0
      EVOLUTION_API_URL: http://host.docker.internal:8081
    networks:
      - facilcar-sdr
    command: ["python", "-m", "sdr.worker"]

networks:
  facilcar-sdr:
    name: facilcar-sdr
    driver: bridge
